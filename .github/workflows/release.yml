name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Server tests (static and unit)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q -r server/requirements.txt pillow
          cd server && bash tests/make_testmedia.sh >/dev/null
          fail=0; for t in tests/test_*.py; do python3 "$t" > "/tmp/$(basename "$t").log" 2>&1 || { echo "::error::$t failed"; tail -20 "/tmp/$(basename "$t").log"; fail=1; }; done
          exit $fail

      - name: Build server tarball
        run: bash scripts/pack-server.sh dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MOVINITE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MOVINITE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MOVINITE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export MOVINITE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$MOVINITE_KEYSTORE_FILE"
          else
            unset MOVINITE_KEYSTORE_PASSWORD MOVINITE_KEY_ALIAS MOVINITE_KEY_PASSWORD
            echo "::warning::No signing secrets set -- attaching a debug-signed APK"
          fi
          cd android && ./build-apk.sh ../dist
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: movinite-${{ github.ref_name }}
          path: dist/*

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --draft --title "Movinite ${{ github.ref_name }}" \
            --notes "See CHANGELOG.md and server/CHANGELOG.md. Verify downloads with the .sha256 files."
