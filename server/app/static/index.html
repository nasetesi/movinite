<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movinite</title>
<meta name="theme-color" content="#0b0612">
<meta name="application-name" content="Movinite">
<meta name="apple-mobile-web-app-title" content="Movinite">
<link rel="icon" href="/static/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/static/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css?v=1.2.1">
</head>
<body>
<div id="auth" class="auth hidden"></div>
<div id="shell" class="shell hidden">
  <aside class="side" id="side">
    <a class="brand" href="#/home" aria-label="Movinite home"><img class="brand-logo" src="/static/logo-bar.png" alt="Movinite" width="190" height="30"></a>
    <nav>
      <a href="#/home" data-nav="home">&#8962; Home</a>
      <div class="navhead">Libraries</div>
      <div id="navlibs"></div>
      <div class="navhead">Manage</div>
      <a href="#/settings" data-nav="settings">&#9881; Settings</a>
    </nav>
    <div class="side-foot"><span id="whoami"></span> &middot; <a href="#" id="logout">Sign out</a><div class="ver" id="ver"></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="iconbtn menu" id="menubtn" title="Menu">&#9776;</button>
      <a class="top-brand" href="#/home" aria-label="Movinite home"><img src="/static/logo-mark.png" alt="" width="40" height="26"></a>
      <input id="search" type="search" placeholder="Search movies, shows, music..." autocomplete="off">
      <div id="activity" class="activity hidden" role="status" aria-live="polite"></div>
      <button class="iconbtn snd-btn" id="sndbtn" type="button" aria-pressed="true" aria-label="Poster sounds" title="Poster sounds"></button>
      <!-- 1.5.1: phone top bar (search icon + account avatar); hidden on wide screens -->
      <button class="iconbtn m-ico" id="m-search" type="button" aria-label="Search" title="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <div id="sysstat" class="sysstat hidden"><button class="ss-pill" id="ss-pill" type="button" aria-haspopup="true" aria-expanded="false" title="Server status"></button><div class="ss-panel hidden" id="ss-panel" role="dialog" aria-label="Server status"></div></div>
      <div class="acct-w"><button class="avatar" id="m-avatar" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account" title="Account"></button>
        <div class="acct-menu hidden" id="acct-menu" role="menu" aria-label="Account">
          <div class="acct-who"><span class="avatar big" id="acct-ini"></span><div><b id="acct-name"></b><div class="muted" id="acct-role"></div></div></div>
          <a role="menuitem" href="#/settings/account" id="acct-account">My account</a>
          <a role="menuitem" href="#/settings" id="acct-settings">Settings</a>
          <button role="menuitem" type="button" id="acct-sound">Poster sounds: on</button>
          <button role="menuitem" type="button" id="acct-logout" class="danger-t">Sign out</button>
          <div class="acct-ver muted" id="acct-ver"></div>
        </div></div>
    </header>
    <main id="view"></main>
    <!-- 1.5.1: phone bottom tab bar (replaces the menu button on phones) -->
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5L12 3.5l8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg><span>Home</span></a>
      <a href="#/libraries" data-tab="libraries"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M10 4v16M15 4.5l4.5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Libraries</span></a>
      <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Search</span></a>
      <a href="#/mylist" data-tab="mylist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V21l-6.5-4.5L5.5 21V4.5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg><span>My List</span></a>
      <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.8l1.6 2.3 2.7-.7.7 2.7 2.3 1.6-1.2 2.5 1.2 2.5-2.3 1.6-.7 2.7-2.7-.7L12 21.2l-1.6-2.3-2.7.7-.7-2.7-2.3-1.6L5.9 12 4.7 9.5 7 7.9l.7-2.7 2.7.7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span id="tab-set-l">Settings</span></a>
    </nav>
  </div>
</div>

<div id="pip-chip" class="pip-chip hidden" role="status"><span class="dot"></span><span id="pip-chip-t">Playing in picture-in-picture</span><button class="btn small" id="pip-chip-back" type="button">Back to player</button><button class="iconbtn" id="pip-chip-close" type="button" title="Stop and close" aria-label="Stop and close">&#10005;</button></div>
<div id="player" class="player hidden">
  <div class="pl-top">
    <button class="iconbtn" id="pl-close" title="Close (Esc)" aria-label="Close">&#10005;</button>
    <div class="pl-title" id="pl-title"></div>
    <!-- 1.4.13: the pickers live in the bottom bar (Quality / Subtitles / Audio buttons); these hidden selects keep the state -->
    <div class="pl-opts" hidden>
      <select id="pl-quality" title="Quality" tabindex="-1"></select>
      <select id="pl-audio" title="Audio track" tabindex="-1"></select>
      <select id="pl-subs" title="Subtitles" tabindex="-1"></select>
    </div>
  </div>
  <div class="pl-stage" id="pl-stage">
    <video id="video" playsinline controlslist="nofullscreen nodownload"></video>
    <!-- 1.7.5: custom cue overlay (WebView often ignores ::cue; fetch+paint so captions stay after HLS/seek) -->
    <div class="pl-cues hidden" id="pl-cues" aria-live="off"></div>
    <!-- 1.4.11: tap the picture to show / hide the big buttons; double-tap the left / right side to skip -->
    <div class="pl-tap" id="pl-tap" aria-hidden="true"></div>
    <div class="pl-ov" id="pl-ov">
      <div class="pl-ctr">
        <button class="pl-big" id="pl-back" type="button" title="Back 10 seconds (Left arrow)" aria-label="Back 10 seconds"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" d="M10.5 24a13.5 13.5 0 1 0 4-9.6"/><path fill="currentColor" d="M8 8.5v10h10z"/></svg><span>10</span></button>
        <button class="pl-big pl-pp" id="pl-pp" type="button" title="Play / Pause (Space)" aria-label="Pause"><svg class="i-pause" viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M15 11h6v26h-6zM27 11h6v26h-6z"/></svg><svg class="i-play" viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M17 10.5v27l21-13.5z"/></svg></button>
        <button class="pl-big" id="pl-fwd" type="button" title="Forward 10 seconds (Right arrow)" aria-label="Forward 10 seconds"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" d="M37.5 24a13.5 13.5 0 1 1-4-9.6"/><path fill="currentColor" d="M40 8.5v10H30z"/></svg><span>10</span></button>
      </div>
    </div>
    <div class="pl-ss hidden" id="pl-ss" aria-live="off"></div>
    <div class="pl-hint hidden" id="pl-hint" role="status"></div>
    <div class="pl-rip left" id="pl-rip-l" aria-hidden="true"><b></b></div>
    <div class="pl-rip right" id="pl-rip-r" aria-hidden="true"><b></b></div>
    <div class="pl-status" id="pl-status"></div>
    <!-- 1.4.13: our own see-through control bar (replaces the browser's): seek, time, play, skip, volume, then Quality, Subtitles, Audio, PiP, Full screen -->
    <div class="pl-bar" id="pl-bar">
      <div class="pl-seek" id="pl-seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="pl-rail"><div class="pl-buf" id="pl-buf"></div><div class="pl-prog" id="pl-prog"></div></div>
        <div class="pl-knob" id="pl-knob"></div>
        <div class="pl-tip hidden" id="pl-tip">0:00</div>
      </div>
      <div class="pl-row">
        <button class="pl-cb pl-bplay" id="pl-bplay" type="button" title="Play / Pause (Space)" aria-label="Pause"><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
        <button class="pl-cb pl-wide-only" id="pl-bback" type="button" title="Back 10 seconds (Left arrow)" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5.5 12a6.5 6.5 0 1 0 2-4.7"/><path fill="currentColor" d="M4 3.5v5.5h5.5z"/></svg><span class="n">10</span></button>
        <button class="pl-cb pl-wide-only" id="pl-bfwd" type="button" title="Forward 10 seconds (Right arrow)" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M18.5 12a6.5 6.5 0 1 1-2-4.7"/><path fill="currentColor" d="M20 3.5v5.5h-5.5z"/></svg><span class="n">10</span></button>
        <div class="pl-volw">
          <button class="pl-cb" id="pl-mute" type="button" title="Mute (M)" aria-label="Mute"><svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9.2a4 4 0 0 1 0 5.6M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg><svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
          <input type="range" class="pl-vol" id="pl-vol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        </div>
        <span class="pl-time" id="pl-time">0:00 / 0:00</span>
        <span class="pl-sp"></span>
        <button class="pl-cb pl-lbl hidden" id="pl-next" type="button" title="Next episode">Next &#9654;</button>
        <button class="pl-cb pl-lbl" id="pl-bq" type="button" title="Quality and speed" aria-label="Quality and speed" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg><span class="t" id="pl-bq-t">Original</span></button>
        <button class="pl-cb" id="pl-bcc" type="button" title="Subtitles" aria-label="Subtitles" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M10.6 10.3a2.2 2.2 0 1 0 0 3.4l1 1.1a3.7 3.7 0 1 1 0-5.6zm6.5 0a2.2 2.2 0 1 0 0 3.4l1 1.1a3.7 3.7 0 1 1 0-5.6z"/></svg></button>
        <button class="pl-cb hidden" id="pl-baud" type="button" title="Audio track" aria-label="Audio track" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h1v-8H6v-1a6 6 0 0 1 12 0v1h-2v8h1a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8z"/></svg></button>
        <button class="pl-cb pl-pip hidden" id="pl-pip" type="button" title="Picture in picture (P)" aria-label="Picture in picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v10h16V7H4zm8 4h7v5h-7v-5z"/></svg></button>
        <button class="pl-cb pl-fsbtn" id="pl-fs" type="button" title="Full screen (F)" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 3v-3h2v5h-5v-2h3z"/></svg></button>
      </div>
    </div>
    <div class="pl-pop hidden" id="pl-pop" role="menu" aria-label="Options"></div>
  </div>
</div>

<div id="audiobar" class="audiobar hidden">
  <button class="iconbtn ab-tool" id="ab-back" type="button" title="Back" aria-label="Close now playing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.8 9.6L12 14.8l5.2-5.2"/></svg></button>
  <div class="ab-stage" id="ab-stage">
    <canvas id="ab-viz" width="640" height="640" aria-hidden="true"></canvas>
    <img id="ab-art" alt="" title="Now playing">
  </div>
  <div class="ab-meta" id="ab-meta"><div id="ab-title"></div><div id="ab-sub" class="muted"></div></div>
  <div class="ab-transport">
    <div class="ab-ctl">
      <button class="iconbtn" id="ab-prev" type="button" title="Previous" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5.5 5h2.25v14H5.5zm2.75 7L18.5 18.75V5.25z"/></svg></button>
      <button class="iconbtn" id="ab-play" type="button" title="Play/Pause" aria-label="Play"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
      <button class="iconbtn" id="ab-next" type="button" title="Next" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.25 5H18.5v14h-2.25zm-2.75 7L5.5 18.75V5.25z"/></svg></button>
    </div>
    <div class="ab-volw" id="ab-volw">
      <button class="iconbtn ab-tool" id="ab-mute" type="button" title="Mute (M)" aria-label="Mute" aria-pressed="false">
        <svg class="i-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.75 9.5h3.1L12.5 6v12l-4.65-3.5H4.75A1.25 1.25 0 0 1 3.5 13.25v-2.5A1.25 1.25 0 0 1 4.75 9.5Z"/><path d="M15.2 9.6a3.4 3.4 0 0 1 0 4.8"/><path d="M17.15 7.4a6.2 6.2 0 0 1 0 9.2"/></svg>
        <svg class="i-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.75 9.5h3.1L12.5 6v12l-4.65-3.5H4.75A1.25 1.25 0 0 1 3.5 13.25v-2.5A1.25 1.25 0 0 1 4.75 9.5Z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <input type="range" id="ab-vol" min="0" max="100" value="100" step="1" title="Volume" aria-label="Volume">
      <button class="iconbtn ab-tool" id="ab-vol-open" type="button" title="Volume" aria-label="Volume" aria-expanded="false" aria-controls="ab-vol-pop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.75v14.5"/><circle cx="12" cy="9.5" r="2.15" fill="currentColor" stroke="none"/><path d="M8.75 4.75h6.5M8.75 19.25h6.5"/></svg>
      </button>
      <div class="ab-vol-pop hidden" id="ab-vol-pop" role="dialog" aria-label="Volume">
        <input type="range" id="ab-vol-v" min="0" max="100" value="100" step="1" aria-label="Volume">
      </div>
    </div>
  </div>
  <div class="ab-seek"><span id="ab-cur">0:00</span><input type="range" id="ab-range" min="0" max="1000" value="0"><span id="ab-dur">0:00</span></div>
  <button class="iconbtn ab-tool" id="ab-add" type="button" title="Add to playlist" aria-label="Add to playlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 6.5v11M6.5 12h11"/></svg></button>
  <button class="iconbtn ab-tool" id="ab-viz-toggle" type="button" title="Visualizer" aria-label="Toggle visualizer" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.25"/><circle cx="12" cy="12" r="6.25"/><circle cx="12" cy="12" r="10.25"/></svg></button>
  <button class="iconbtn ab-tool eq-btn" id="ab-eq" type="button" title="Equalizer" aria-label="Equalizer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M7 16.5V7.5"/><path d="M12 19.25V4.75"/><path d="M17 15V9"/></svg></button>
  <button class="iconbtn ab-tool" id="ab-close" type="button" title="Stop" aria-label="Stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  <audio id="audio" preload="auto"></audio>
</div>

<div id="eqpanel" class="eq-panel hidden" role="dialog" aria-label="Equalizer">
  <div class="eq-head">
    <b>Equalizer</b>
    <label class="eq-toggle"><input type="checkbox" id="eq-on"> On</label>
    <button class="btn ghost small" type="button" id="eq-reset">Reset</button>
    <button class="iconbtn" type="button" id="eq-close" title="Close" aria-label="Close equalizer">&#10005;</button>
  </div>
  <div class="eq-presets" id="eq-presets"></div>
  <div class="eq-bands" id="eq-bands"></div>
</div>


<div id="plsheet" class="plsheet-back hidden" hidden>
  <div class="plsheet" role="dialog" aria-labelledby="plsheet-title" aria-modal="true">
    <div class="plsheet-grab" aria-hidden="true"></div>
    <div class="plsheet-head">
      <b id="plsheet-title">Add to playlist</b>
      <button class="iconbtn ab-tool" type="button" id="plsheet-close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
    </div>
    <div class="plsheet-new">
      <input type="text" id="plsheet-name" placeholder="New playlist name" maxlength="80" autocomplete="off">
      <button class="btn small" type="button" id="plsheet-create">Create</button>
    </div>
    <div class="plsheet-list" id="plsheet-list"></div>
  </div>
</div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/hls.min.js"></script>
<script src="/static/app.js?v=1.2.1"></script>
</body>
</html>
